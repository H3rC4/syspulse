[package]
name = "syspulse"
version = "0.3.0"
edition = "2021"
authors = ["SysPulse Contributors"]
description = "Cross-platform system optimizer and process monitor with Slint UI"
license = "MIT"
repository = "https://github.com/H3rC4/syspulse"
rust-version = "1.75"

[dependencies]
slint = "1.5"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.30"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trash = "4"
sha2 = "0.10"
md5 = "0.7"
walkdir = "2"
fluent-bundle = "0.15"
unic-langid = { version = "0.9", features = ["macros"] }
once_cell = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
tray-icon = "0.15"
tao = "0.24"
clap = { version = "4", features = ["derive"] }
csv = "1"
tokio-util = "0.7"
rfd = "0.14"
open = "5"

[target.'cfg(windows)'.dependencies]
wmi = "0.14"
windows = { version = "0.54", features = [
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_Foundation",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Wmi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_ProcessStatus",
] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = "1.5"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "syspulse"
path = "src/main.rs"
